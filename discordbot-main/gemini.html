<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权力的游戏：爆笑编年史</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            display: block;
            background-color: #0c0c1a; /* 深邃的夜空蓝 */
        }
        #title-overlay {
            position: absolute;
            color: white;
            font-size: 3vw;
            text-align: center;
            text-shadow: 0 0 10px #ffc107, 0 0 20px #ff9800;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none; /* 允许点击穿透 */
        }
    </style>
</head>
<body>
<div id="title-overlay"></div>
<canvas id="gameCanvas"></canvas>

<script>
    // 使用一个立即执行函数表达式 (IIFE) 来封装所有代码，避免污染全局作用域
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const titleOverlay = document.getElementById('title-overlay');

        let width, height;
        let particles = [];
        let entities = []; // 用于存放所有动态实体（士兵，船等）

        // ===================================
        //  通用工具函数
        // ===================================
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // 显示标题的函数
        function showTitle(text, duration = 4000) {
            titleOverlay.innerHTML = text;
            titleOverlay.style.opacity = 1;
            setTimeout(() => {
                titleOverlay.style.opacity = 0;
            }, duration);
        }

        // ===================================
        //  粒子类 (核心视觉效果)
        // ===================================
        class Particle {
            constructor(x, y, color, size, velocity, lifespan, gravity = 0) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.abs(size);
                this.velocity = velocity || { x: random(-2, 2), y: random(-2, 2) };
                this.lifespan = lifespan || random(50, 100);
                this.initialLifespan = this.lifespan;
                this.gravity = gravity;
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.velocity.y += this.gravity;
                this.lifespan--;
                if (this.size > 0.1) this.size *= 0.98;
            }

            draw() {
                const opacity = this.lifespan / this.initialLifespan;
                ctx.globalAlpha = opacity > 0 ? opacity : 0;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // ===================================
        //  场景管理
        // ===================================
        let currentScene = null;
        let sceneStartTime = 0;
        const sceneDurations = [12000, 15000, 20000]; // 每个场景的毫秒数
        let sceneIndex = 0;

        const scenes = [
            setupSceneBlackwater,
            setupSceneBastards,
            setupSceneLongNight
        ];

        function switchScene() {
            particles = [];
            entities = [];
            ctx.clearRect(0, 0, width, height);

            currentScene = scenes[sceneIndex];
            currentScene();
            sceneStartTime = Date.now();

            sceneIndex = (sceneIndex + 1) % scenes.length;
        }

        // ===================================
        //  场景1: 黑水河之役
        // ===================================
        function setupSceneBlackwater() {
            showTitle("第一章<br>黑水河之役：预算在燃烧");
            // 创建一些呆萌的船
            for (let i = 0; i < 5; i++) {
                entities.push({
                    x: random(width * 0.1, width * 0.4),
                    y: height * 0.6 + random(-20, 20),
                    type: 'ship',
                    draw: function() {
                        ctx.fillStyle = '#5d4037';
                        ctx.fillRect(this.x, this.y, 80, 20);
                        ctx.beginPath();
                        ctx.moveTo(this.x + 40, this.y);
                        ctx.lineTo(this.x + 40, this.y - 40);
                        ctx.strokeStyle = '#8d6e63';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                });
            }

            // 野火“小船”
            entities.push({
                x: width,
                y: height * 0.65,
                type: 'wildfire_ship',
                update: function() { this.x -= 2; },
                draw: function() {
                    ctx.fillStyle = '#4caf50';
                    ctx.fillRect(this.x, this.y, 30, 10);
                    ctx.fillText("快递", this.x, this.y - 5);
                }
            });
        }

        function updateSceneBlackwater() {
            // 当野火船到达引爆点
            const wildfireShip = entities.find(e => e.type === 'wildfire_ship');
            if (wildfireShip && wildfireShip.x < width * 0.5 && !wildfireShip.exploded) {
                wildfireShip.exploded = true;
                // 大爆炸！
                for (let i = 0; i < 2000; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = random(5, 20) * (1 - Math.random() * Math.random());
                    const velocity = {
                        x: Math.cos(angle) * speed,
                        y: Math.sin(angle) * speed
                    };
                    const color = `hsl(${random(80, 140)}, 100%, ${random(50, 80)}%)`;
                    particles.push(new Particle(wildfireShip.x, wildfireShip.y, color, random(3, 8), velocity, random(100, 200), 0.1));
                }
                showTitle("“尝尝我的独家秘制BBQ酱！”", 3000);
            }
        }

        function drawSceneBlackwater() {
            // 绘制水面
            ctx.fillStyle = '#1a237e';
            ctx.fillRect(0, height * 0.6, width, height * 0.4);
        }

        // ===================================
        //  场景2: 私生子之战
        // ===================================
        class Soldier {
            constructor(x, y, color, targetX) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.targetX = targetX;
                this.isCharging = true;
            }
            update() {
                if (this.isCharging) {
                    const dir = Math.sign(this.targetX - this.x);
                    if (Math.abs(this.x - this.targetX) > 10) {
                        this.x += dir * random(1, 3);
                    } else {
                        this.isCharging = false;
                        // 碰撞后变成血迹粒子
                        for (let i = 0; i < 5; i++) {
                            particles.push(new Particle(this.x, this.y, '#e53935', random(1, 3), null, 50, 0.1));
                        }
                    }
                }
            }
            draw() {
                if (this.isCharging) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 5, 0, Math.PI * 2); // 萌萌的圆形士兵
                    ctx.fill();
                }
            }
        }

        function setupSceneBastards() {
            showTitle("第二章<br>私生子之战：人山人海战术");
            // 囧雪诺的军队
            for (let i = 0; i < 200; i++) {
                entities.push(new Soldier(random(0, width * 0.2), random(height * 0.4, height * 0.6), '#b0bec5', width / 2));
            }
            // 小剥皮的军队
            for (let i = 0; i < 250; i++) {
                entities.push(new Soldier(random(width * 0.8, width), random(height * 0.4, height * 0.6), '#ff7043', width / 2));
            }

            // 谷地骑士救援
            setTimeout(() => {
                showTitle("援军？不，是外卖到了！", 3000);
                for (let i = 0; i < 150; i++) {
                    entities.push(new Soldier(random(-width*0.2, 0), random(0, height), '#4fc3f7', random(width*0.4, width*0.6)));
                }
            }, sceneDurations[1] * 0.6);
        }

        function updateSceneBastards() { /* 逻辑在 Soldier 类中 */ }

        function drawSceneBastards() {
            // 绘制战场
            ctx.fillStyle = '#cfd8dc';
            ctx.fillRect(0, 0, width, height);
        }

        // ===================================
        //  场景3: 长夜与龙焰
        // ===================================
        class Dragon {
            constructor() {
                this.x = -100;
                this.y = height * 0.2;
                this.pathY = this.y;
                this.angle = 0;
                this.breathingFire = false;
            }
            update() {
                this.x += 3;
                this.y = this.pathY + Math.sin(this.angle) * 50;
                this.angle += 0.05;

                if (this.breathingFire && Math.random() < 0.8) {
                    const fireVel = {
                        x: random(-1, 1),
                        y: random(8, 15)
                    };
                    const color = `hsl(${random(0, 50)}, 100%, 50%)`;
                    particles.push(new Particle(this.x, this.y + 30, color, random(5, 15), fireVel, 80, 0));
                }
            }
            draw() {
                ctx.fillStyle = '#212121';
                // 简化版的龙 (像个小胖蝙蝠)
                ctx.beginPath();
                ctx.moveTo(this.x - 50, this.y);
                ctx.quadraticCurveTo(this.x, this.y - 30, this.x + 50, this.y);
                ctx.quadraticCurveTo(this.x, this.y + 30, this.x - 50, this.y);
                ctx.fill();
            }
        }

        let buildings = [];
        let nightKing = { alive: true, x: 0, y: 0 };

        function setupSceneLongNight() {
            showTitle("最终章<br>冰与火：空调遥控器争夺战");
            // Part 1: 长夜
            nightKing = {
                alive: true,
                x: width / 2,
                y: height - 50,
                shattered: false,
                draw: function() {
                    if(this.alive) {
                        ctx.fillStyle = '#00e5ff';
                        ctx.fillRect(this.x - 10, this.y - 40, 20, 40);
                        ctx.fillText("冷酷Boy", this.x - 20, this.y - 50);
                    }
                },
                update: function() {
                    if (this.alive && Math.random() < 0.1) {
                        // 发射冰霜粒子
                        particles.push(new Particle(this.x, this.y-40, '#80deea', random(2, 4), {x: random(-2,2), y: random(-5, -2)}, 100));
                    }
                }
            };
            entities.push(nightKing);

            // 艾莉亚的“突袭”
            setTimeout(() => {
                if (nightKing.alive) {
                    nightKing.shattered = true;
                    nightKing.alive = false;
                    showTitle("“Not Today.”", 2000);
                    for (let i = 0; i < 500; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = random(1, 8);
                        const vel = { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed };
                        particles.push(new Particle(nightKing.x, nightKing.y - 20, `hsl(180, 100%, ${random(50, 90)}%)`, random(1, 4), vel, 150, 0.05));
                    }
                }
            }, 6000);

            // Part 2: 龙焰焚城
            setTimeout(() => {
                showTitle("...以及最终战：<br>“我好像没听到钟声？”", 4000);
                entities = []; // 清空夜王
                const dragon = new Dragon();
                entities.push(dragon);

                // 创建君临的屋顶
                buildings = [];
                for (let x = 0; x < width; x += 50) {
                    buildings.push({
                        x: x,
                        y: height,
                        w: random(40, 50),
                        h: random(height * 0.1, height * 0.4),
                        color: '#c62828',
                        onFire: false
                    });
                }

                setTimeout(() => {
                    dragon.breathingFire = true;
                    ctx.font = "bold 30px Arial";
                    ctx.fillStyle = "orange";
                    ctx.fillText("DRACARYS!", dragon.x, dragon.y - 50);
                }, 2000);

            }, 8000);
        }

        function updateSceneLongNight() {
            // 检查火焰粒子是否击中建筑
            particles.forEach(p => {
                if (p.color.startsWith('hsl(0') || p.color.startsWith('hsl(1') || p.color.startsWith('hsl(2') || p.color.startsWith('hsl(3') || p.color.startsWith('hsl(4') || p.color.startsWith('hsl(5')) { // 检查是否是火焰
                    buildings.forEach(b => {
                        if (p.x > b.x && p.x < b.x + b.w && p.y > height - b.h) {
                            b.onFire = true;
                        }
                    });
                }
            });

            buildings.forEach(b => {
                if(b.onFire && b.h > 20) {
                    b.h -= 0.5; // 建筑被烧毁坍塌
                    if(Math.random() < 0.2){
                        particles.push(new Particle(b.x + b.w/2, height - b.h, 'grey', random(1,3), null, 50, 0.2));
                    }
                }
            });
        }

        function drawSceneLongNight() {
            if(nightKing.alive || nightKing.shattered) {
                // 长夜背景
                ctx.fillStyle = '#01579b';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#eceff1';
                ctx.fillRect(0, height - 20, width, 20); // 冰冻地面
            } else {
                // 君临背景
                ctx.fillStyle = '#ffcc80'; // 黄昏天空
                ctx.fillRect(0,0,width,height);
                // 绘制建筑
                buildings.forEach(b => {
                    ctx.fillStyle = b.onFire ? (Math.random() > 0.5 ? '#ff7043' : '#424242') : b.color;
                    ctx.fillRect(b.x, height - b.h, b.w, b.h);
                });
            }
        }


        // ===================================
        //  主循环
        // ===================================
        function gameLoop() {
            // 检查是否切换场景
            if (Date.now() - sceneStartTime > sceneDurations[sceneIndex === 0 ? scenes.length - 1 : sceneIndex - 1]) {
                switchScene();
            }

            // 根据当前场景绘制背景
            if (currentScene === setupSceneBlackwater) drawSceneBlackwater();
            else if (currentScene === setupSceneBastards) drawSceneBastards();
            else if (currentScene === setupSceneLongNight) drawSceneLongNight();

            // 更新和绘制所有实体
            entities.forEach((entity, index) => {
                if (entity.update) entity.update();
                if (entity.draw) entity.draw();
            });

            // 更新和绘制所有粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].lifespan <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 更新场景特定逻辑
            if (currentScene === setupSceneBlackwater) updateSceneBlackwater();
            else if (currentScene === setupSceneBastards) updateSceneBastards();
            else if (currentScene === setupSceneLongNight) updateSceneLongNight();


            requestAnimationFrame(gameLoop);
        }

        // ===================================
        //  初始化
        // ===================================
        window.addEventListener('resize', resizeCanvas);

        function init() {
            resizeCanvas();
            switchScene(); // 开始第一个场景
            gameLoop();
        }

        init();

    })();
</script>
</body>
</html>
